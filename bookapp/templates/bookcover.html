<!DOCTYPE html>
<html>
<head>
  <title>Book Back Cover</title>
  <style>
    body {
      background-color: #1e3a5f;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      padding: 40px;
    }
    .cover {
      width: 350px;
      background-color: #2c5282;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
    }
    h1 { color: #f6e05e; }
    .price { font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="cover">
    <h1>The Silent Garden</h1>
    <h3>By Anita Rao</h3>
    <p>A gripping story of a young woman who discovers a hidden garden and the secrets buried within it.</p>
    <p class="price">Price: Rs. 250</p>
  </div>
</body>
</html>
